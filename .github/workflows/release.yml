# Automatic Windows release builds (spec § BUILD.md).
# Trigger: push to main. If any pushed commit message contains a version
# tag like v1.0, the EXE is built on Windows and published as a GitHub
# Release (tag vX.Y is pushed automatically).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write   # push release tag
  issues: write     # create GitHub release

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from commit message
        id: version
        run: |
          BEFORE="${{ github.event.before.sha }}"
          MSG="$(git log -1 --format=%B)"
          if git cat-file -e "$BEFORE" >/dev/null 2>&1; then
            MSG="$(git log --format=%B "$BEFORE" "$GITHUB_SHA")"$'\n'"$MSG"
          fi
          # last match wins -> newest pushed commit's version
          VERSION="$(printf '%s' "$MSG" | grep -oE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSION" ]; then
            echo "No vX.Y in commit message(s) - skipping release."
          else
            echo "Release version: $VERSION"
          fi

  build:
    needs: detect-version
    if: needs.detect-version.outputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install --no-cache-dir PySide6 psutil pywin32 pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean build/AnchorWin.spec
      - name: Name release asset
        run: Move-Item dist/AnchorWin.exe "dist/AnchorWin-${{ needs.detect-version.outputs.version }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: anchorwin-win
          path: dist/AnchorWin-*.exe

  release:
    needs: [detect-version, build]
    if: needs.detect-version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anchorwin-win
          path: dist
      - name: Create release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          gh release delete "$VERSION" --yes >/dev/null 2>&1 || true
          {
            echo "AnchorWin $VERSION (Windows x64)"
            echo
            echo "Download \`AnchorWin-$VERSION.exe\` and run it. Configuration:"
            echo "%APPDATA%\\AnchorWin\\config.json (portable mode: portable.flag"
            echo "next to the EXE stores settings beside the program)."
          } > RELEASE_NOTES.md
          gh release create "$VERSION" \
            --title "AnchorWin $VERSION" \
            --target main \
            --notes-file RELEASE_NOTES.md \
            "dist/AnchorWin-$VERSION.exe"
